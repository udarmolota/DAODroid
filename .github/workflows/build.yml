name: Build DAODroid launcher APK

# The launcher APK only (the "launcher" flavor): no game code, so it can be built and published
# here. The game library comes in each player's own game package, made on their PC.
#
# Signing: the release APK is signed with the release key when the repository's secrets hold it
# (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64  the key store file, base64-encoded
#   RELEASE_STORE_PASSWORD   its password
#   RELEASE_KEY_ALIAS        the key's alias
#   RELEASE_KEY_PASSWORD     the key's password
# Without them (pull requests from forks, say) it is debug-signed, as android/app/build.gradle does.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -n 1)
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      # SDL3 isn't in DAORecomp's git: its installer fetches it (recomp/installer/deps.py).
      # The same pinned commit here.
      - name: Fetch SDL3
        shell: bash
        run: |
          set -euo pipefail
          SDL_COMMIT=$(grep -A1 '"thirdparty/SDL"' recomp/installer/deps.py | grep -oE '[0-9a-f]{40}')
          test -n "$SDL_COMMIT"
          git init -q recomp/thirdparty/SDL
          git -C recomp/thirdparty/SDL fetch -q --depth 1 https://github.com/libsdl-org/SDL.git "$SDL_COMMIT"
          git -C recomp/thirdparty/SDL checkout -q FETCH_HEAD
          echo "SDL $SDL_COMMIT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"

      # The key store goes to the runner's temp folder, never into the workspace.
      - name: Set up release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "No release key in the secrets: the release APK will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build launcher APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleLauncherDebug assembleLauncherRelease

      - name: Remove the key store
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" android/keystore.properties

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: daodroid-launcher-debug-${{ steps.app_version.outputs.name }}
          path: android/app/build/outputs/apk/launcher/debug/app-launcher-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: daodroid-launcher-release-${{ steps.app_version.outputs.name }}
          path: android/app/build/outputs/apk/launcher/release/app-launcher-release.apk
          retention-days: 30

      # Who signed the release APK (the release key, or Android Debug without the secrets).
      # Informational only: it never fails the build.
      - name: Show the release APK's signer
        continue-on-error: true
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n 1)
          echo "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/launcher/release/app-launcher-release.apk
